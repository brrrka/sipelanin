name: sipelanin
description: "Sistem Peringatan Dini Perlintasan Sebidang - Aplikasi monitoring perlintasan kereta api berbasis IoT."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  gap: ^3.0.1
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  firebase_database: ^11.3.5
  cloud_firestore: ^5.6.7
  firebase_messaging: ^15.2.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Local notifications (FCM foreground)
  flutter_local_notifications: ^18.0.1

  # Persistence
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
